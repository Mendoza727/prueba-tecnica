# Solo PROD — app + PostgreSQL
services:
  db:
    image: postgres:16-alpine
    container_name: customers-db
    env_file:
      - .env.prod
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customers -d customers"]
      interval: 5s
      timeout: 5s
      retries: 10

  customers:
    build: .
    container_name: customers-prod
    env_file:
      - .env.prod
    ports:
      - "9090:9090"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: