# ===== PROD simulado (PostgreSQL) =====
# Valores por defecto para local; en Docker Compose se sobreescriben con DB_URL / DB_USER / DB_PASSWORD
server.port=9090
spring.application.name=customers-prod
app.message=Ejecutando en PROD

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.h2.console.enabled=false
logging.level.root=WARN
logging.level.com.example.customers=INFO
