# ===== LOCAL / DEV (H2 en memoria) =====
server.port=8080
spring.application.name=customers-dev
app.message=Ejecutando en DEV

# Datasource H2
spring.datasource.url=jdbc:h2:mem:customers_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola H2: http://localhost:8080/h2-console
# JDBC URL al conectar: jdbc:h2:mem:customers_dev
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.example.customers=DEBUG
